<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | SecureDemo'">Door Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" th:href="@{/}">Access Control Operations</a>
    <a class="btn btn-outline-light btn-sm" th:href="@{/doors}">Back to Doors</a>
</nav>

<main class="container py-5" style="max-width: 760px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-4" th:text="${pageTitle}">Add Door</h1>

            <form th:object="${door}"
                  th:action="${door.id == null} ? @{/doors} : @{/doors/{id}/edit(id=${door.id})}"
                  method="post">

                <div class="mb-3">
                    <label for="name" class="form-label">Door Name</label>
                    <input id="name" type="text" class="form-control"
                           th:field="*{name}" maxlength="80" required>
                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="location" class="form-label">Location</label>
                    <input id="location" type="text" class="form-control"
                           th:field="*{location}" maxlength="120" required>
                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('location')}"
                         th:errors="*{location}"></div>
                </div>

                <div class="mb-4">
                    <label for="status" class="form-label">Simulated Status</label>
                    <select id="status" class="form-select" th:field="*{status}" required>
                        <option value="">Choose a status</option>
                        <option value="SECURE">Secure</option>
                        <option value="UNLOCKED">Unlocked</option>
                        <option value="OFFLINE">Offline</option>
                    </select>
                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('status')}"
                         th:errors="*{status}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Door</button>
                    <a th:href="@{/doors}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
