<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Access Control Operations</a>
        <div class="d-flex gap-3 align-items-center">
            <a class="text-white" th:href="@{/}">Dashboard</a>
            <a class="text-white" th:href="@{/doors}">Door Management</a>
            <a class="text-white" th:href="@{/events}">Access Events</a>
            <a class="text-white" th:href="@{/admin/users}">User Management</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    Sign Out
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h1>User Management</h1>
    <p class="text-muted">Create accounts for authorized system users.</p>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title">Create User</h5>

            <form th:action="@{/admin/users}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text"
                           class="form-control" maxlength="40"
                           autocomplete="off" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Temporary password</label>
                    <input id="password" name="password" type="password"
                           class="form-control" minlength="12" maxlength="72"
                           autocomplete="new-password" required>
                    <div class="form-text">
                        Use at least 12 characters.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select id="role" name="role" class="form-select" required>
                        <option value="ROLE_OPERATOR">Operator</option>
                        <option value="ROLE_ADMIN">Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title">Existing Users</h5>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Username</th>
                        <th>Role</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <span class="fw-semibold"
                                  th:text="${user.username}">Username</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${user.role == 'ROLE_ADMIN'} ? ' bg-primary' : ' bg-secondary'"
                                  th:text="${user.role == 'ROLE_ADMIN'} ? 'Admin' : 'Operator'">
                                Role
                            </span>
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-2">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/admin/users/{id}/edit(id=${user.id})}">
                                    Edit
                                </a>

                                <form th:if="${user.username != #authentication.name}"
                                      th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                                      method="post" class="m-0"
                                      onsubmit="return confirm('Are you sure you want to delete this user? This cannot be undone.');">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger">
                                        Delete
                                    </button>
                                </form>

                                <span th:if="${user.username == #authentication.name}"
                                      class="text-secondary small align-self-center">
                                    Current account
                                </span>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="3" class="text-center text-muted py-4">
                            No users found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</body>
</html>
