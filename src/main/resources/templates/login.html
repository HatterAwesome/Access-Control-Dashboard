<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | Access Control Operations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">

<main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card login-card">
        <div class="card-body p-4">
            <div class="login-eyebrow mb-2">Access Control Operations</div>
            <h1 class="h3 mb-2">Welcome back</h1>
            <p class="text-secondary mb-4">Sign in to access your security dashboard.</p>

            <!-- Show a message when login fails -->
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>

            <!-- Show a message after logout -->
            <div th:if="${param.logout}" class="alert alert-success">
                You have signed out successfully.
            </div>

            <!-- Send the login details to Spring Security -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text"
                           class="form-control" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" type="password"
                           class="form-control" required>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-2">Sign In</button>
            </form>

            <p class="small text-secondary mt-3 mb-0">
                Demonstration system. Use authorized test accounts only.
            </p>
        </div>
    </div>
</main>

</body>
</html>
