<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit User | Access Control Operations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Access Control Operations</a>
        <div class="d-flex gap-3 align-items-center">
            <a class="text-white" th:href="@{/}">Dashboard</a>
            <a class="text-white" th:href="@{/doors}">Door Management</a>
            <a class="text-white" th:href="@{/events}">Access Events</a>
            <a class="text-white" th:href="@{/admin/users}">User Management</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    Sign Out
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="mb-4">
        <a th:href="@{/admin/users}" class="text-secondary">
            &larr; Back to User Management
        </a>
        <h1 class="mt-3">Edit User</h1>
        <p class="text-secondary">
            Update account details, permissions, or reset the password.
        </p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/admin/users/{id}/edit(id=${user.id})}"
                  method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text"
                           class="form-control" maxlength="40" required
                           th:value="${user.username}">
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select id="role" name="role" class="form-select" required>
                        <option value="ROLE_OPERATOR"
                                th:selected="${user.role == 'ROLE_OPERATOR'}">
                            Operator
                        </option>
                        <option value="ROLE_ADMIN"
                                th:selected="${user.role == 'ROLE_ADMIN'}">
                            Admin
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Reset Password (Optional)
                    </label>
                    <input id="password" name="password" type="password"
                           class="form-control" minlength="12" maxlength="72"
                           autocomplete="new-password">
                    <div class="form-text">
                        Leave blank to keep the current password. A new
                        password must be at least 12 characters.
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>
                    <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
